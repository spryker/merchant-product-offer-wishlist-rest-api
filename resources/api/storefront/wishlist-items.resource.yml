resource:
    name: WishlistItems
    shortName: wishlist-items

    properties:
        productOfferReference:
            type: string
            writable: true
            readable: true
            required: false
            responseOptional: true
            description: 'A unique reference identifier for a specific product offer from a merchant. Answered only for an item added against a product offer; an item added by SKU alone carries none.'
            openapiContext:
                example: 'offer89'

        merchantReference:
            type: string
            writable: false
            readable: true
            required: false
            responseOptional: true
            description: 'A unique reference identifier for a merchant. Answered alongside `productOfferReference`, and absent with it for an item added by SKU alone.'
            openapiContext:
                example: 'MER000001'
